name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DIOXUS_CLI_VERSION: "0.7.5"
  NDK_VERSION: "27.0.12077973"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      - name: Build release APK
        run: dx bundle --platform android --release

      - name: Stage APK artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find target/dx -type f -name "*.apk")
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APKs found under target/dx — dx bundle output path may have changed." >&2
            find target/dx -maxdepth 6 -type d >&2 || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Found: $apk"
            cp "$apk" artifacts/
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: violence-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
