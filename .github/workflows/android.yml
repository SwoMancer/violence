name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DIOXUS_CLI_VERSION: "0.7.5"
  NDK_VERSION: "27.0.12077973"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      - name: Build release APK
        run: dx bundle --platform android --release --target aarch64-linux-android

      - name: Stage and sign APK
        env:
          NIGHTLY_KEYSTORE_B64: ${{ secrets.NIGHTLY_KEYSTORE_B64 }}
          NIGHTLY_KEYSTORE_PASS: ${{ secrets.NIGHTLY_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find target/dx -type f -name "*.apk")
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APKs found under target/dx — dx bundle output path may have changed." >&2
            find target/dx -maxdepth 6 -type d >&2 || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Found: $apk"
            cp "$apk" artifacts/
          done

          release_apk="$(find target/dx -type f -path "*/release/*.apk" ! -name "*unsigned*" | head -n1)"
          if [ -z "${release_apk}" ]; then
            release_apk="$(find target/dx -type f -path "*/release/*.apk" | head -n1)"
          fi
          if [ -z "${release_apk}" ]; then
            release_apk="${apks[0]}"
          fi
          echo "Selected release APK: ${release_apk}"

          build_tools="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          keystore="/tmp/violence-nightly.jks"

          if [ -n "${NIGHTLY_KEYSTORE_B64:-}" ]; then
            echo "${NIGHTLY_KEYSTORE_B64}" | base64 -d > "${keystore}"
            ks_pass="${NIGHTLY_KEYSTORE_PASS}"
            ks_alias="violence-nightly"
          else
            echo "::warning::No signing secret found — falling back to ephemeral debug keystore"
            keystore="${HOME}/.android/debug.keystore"
            mkdir -p "${HOME}/.android"
            keytool -genkeypair -v \
              -keystore "${keystore}" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            ks_pass="android"
            ks_alias="androiddebugkey"
          fi

          aligned="artifacts/violence-nightly.apk"
          "${build_tools}/zipalign" -f -p 4 "${release_apk}" "${aligned}"
          "${build_tools}/apksigner" sign \
            --ks "${keystore}" \
            --ks-pass "pass:${ks_pass}" \
            --key-pass "pass:${ks_pass}" \
            --ks-key-alias "${ks_alias}" \
            "${aligned}"
          "${build_tools}/apksigner" verify --verbose "${aligned}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: violence-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          files: artifacts/violence-nightly.apk
          body: |
            Rolling nightly build from ${{ github.sha }}.
            Installable APK below — no unzip needed.
